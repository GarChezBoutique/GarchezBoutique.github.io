media: assets

content:
  - name: damas
    label: Damas
    type: file
    path: data/damas.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del producto
        type: string
        required: true

      - name: precio
        label: Precio
        type: string
        required: true

      - name: precio_anterior
        label: Precio anterior
        type: string

      - name: color
        label: Color
        type: string

      - name: talla
        label: Talla
        type: string

      - name: imagen
        label: Imagen principal
        type: image
        required: true

      - name: galeria
        label: Fotos adicionales
        type: image
        list:
          max: 5

      - name: descripcion
        label: Descripción
        type: text

      - name: disponibilidad
        label: Disponibilidad
        type: select
        options:
          values:
            - Disponible
            - Agotado

      - name: oferta
        label: Producto en oferta
        type: boolean

  - name: caballeros
    label: Caballeros
    type: collection
    path: Caballeros

  - name: calzado
    label: Calzado
    type: collection
    path: Calzado

  - name: bolsos
    label: Bolsos
    type: collection
    path: Bolsos

  - name: accesorios
    label: Accesorios
    type: collection
    path: Accesorios

  - name: gorras_sombreros
    label: Gorras y Sombreros
    type: collection
    path: Gorras y Sombreros

  - name: hogar
    label: Hogar
    type: collection
    path: Hogar

  - name: lo_nuevo
    label: Lo Nuevo
    type: collection
    path: Lo Nuevo

  - name: ofertas
    label: Ofertas
    type: collection
    path: Ofertas

  - name: relojes
    label: Relojes
    type: collection
    path: Relojes

  - name: temporada
    label: Temporada
    type: collection
    path: Temporada

  - name: articulos
    label: Artículos
    type: collection
    path: Articulos
    filename: "{primary}.md"
    fields:
      - name: title
        label: Título
        type: string
        required: true

      - name: image
        label: Imagen
        type: image

      - name: date
        label: Fecha
        type: date

      - name: body
        label: Contenido
        type: rich-text
