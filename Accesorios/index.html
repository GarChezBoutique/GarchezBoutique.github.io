<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesorios | GarChéz Boutique</title>

  <link rel="stylesheet" href="../assets/style.css">

  <style>
    .gc-products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }

    .gc-product {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      padding-bottom: 18px;
    }

    .gc-product-image {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .gc-product-info {
      padding: 15px;
    }

    .gc-product-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .gc-price {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    .gc-old-price {
      text-decoration: line-through;
      opacity: .6;
      margin-right: 8px;
      font-size: 15px;
    }

    .gc-detail {
      font-size: 14px;
      margin: 5px 0;
    }

    .gc-badges {
      margin-bottom: 8px;
    }

    .gc-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 5px;
      background: #f1f1f1;
    }

    .gc-gallery {
      display: flex;
      gap: 6px;
      padding: 8px 15px 0;
      overflow-x: auto;
    }

    .gc-gallery img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
    }

    .gc-description {
      font-size: 14px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .gc-whatsapp {
      display: block;
      text-align: center;
      margin: 14px 15px 0;
      padding: 11px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .gc-available {
      background: #25D366;
      color: white;
    }

    .gc-unavailable {
      background: #ccc;
      color: #555;
      pointer-events: none;
    }

    .gc-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      opacity: .7;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <span>🚚 Envíos a toda 🇳🇮 Nicaragua</span>
    <span>🚚 Envío GRATIS 📍 Chinandega y El Viejo 🇳🇮</span>
    <span>🛡️ Compra segura</span>
  </div>

  <header class="header">
    <div class="head">

      <a href="../index.html">
        <img src="../assets/LOGO.jpeg" class="logo" alt="GarChéz Boutique">
      </a>

      <div class="search">
        <span>⌕</span>
        <input
          type="search"
          placeholder="¿Qué estás buscando?"
          id="search"
        >
      </div>

      <div class="actions">
        <span>👤</span>
        <span>🛒</span>
      </div>

    </div>
  </header>

  <nav class="nav">
    <a href="../index.html">Inicio</a>
    <a href="../Damas/index.html">Damas</a>
    <a href="../Caballeros/index.html">Caballeros</a>
    <a href="../Calzado/index.html">Calzado</a>
    <a href="../Bolsos/index.html">Bolsos</a>
    <a href="../Accesorios/index.html">Accesorios</a>
    <a href="../Gorras%20y%20Sombreros/index.html">Gorras y Sombreros</a>
    <a href="../Hogar/index.html">Hogar</a>
    <a href="../Lo%20Nuevo/index.html">Lo Nuevo</a>
    <a href="../Ofertas/index.html">Ofertas</a>
    <a href="../Relojes/index.html">Relojes</a>
    <a href="../Temporada/index.html">Temporada</a>
  </nav>

  <main class="container">

    <h1>Accesorios</h1>

    <div id="products" class="gc-products">
      <div class="gc-empty">
        Cargando productos...
      </div>
    </div>

  </main>

  <footer class="footer">
    <p>© GarChéz Boutique 🇳🇮</p>
    <p>Moda, estilo y calidad para ti ✨</p>
  </footer>

  <a
    href="https://wa.me/50587961399"
    target="_blank"
    class="whatsapp"
  >
    💬
  </a>

  <script>
    const productsContainer = document.getElementById("products");
    const searchInput = document.getElementById("search");

    let products = [];

    fetch("../data/accesorios.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo cargar accesorios.json");
        }
        return response.json();
      })
      .then(data => {
        products = Array.isArray(data) ? data : [];
        renderProducts(products);
      })
      .catch(error => {
        console.error(error);

        productsContainer.innerHTML = `
          <div class="gc-empty">
            No se pudieron cargar los productos.
          </div>
        `;
      });

    function renderProducts(items) {

      if (!items.length) {
        productsContainer.innerHTML = `
          <div class="gc-empty">
            Aquí aparecerán los productos de Accesorios.
            <br><br>
            Muy pronto encontrarás nuevos accesorios ✨
          </div>
        `;
        return;
      }

      productsContainer.innerHTML = "";

      items.forEach(product => {

        const card = document.createElement("div");
        card.className = "gc-product";

        const disponible =
          product.disponibilidad !== "Agotado";

        const imagen =
          product.imagen || "";

        const precio =
          product.precio || "";

        const precioAnterior =
          product.precioAnterior || "";

        const whatsappText =
          `Hola 👋, me interesa el producto "${product.nombre || ""}" de GarChéz Boutique.`;

        const whatsappLink =
          `https://wa.me/50587961399?text=${encodeURIComponent(whatsappText)}`;

        let gallery = "";

        if (Array.isArray(product.fotos) && product.fotos.length) {
          gallery = `
            <div class="gc-gallery">
              ${product.fotos.map(photo => `
                <img src="${photo}" alt="${product.nombre || "Producto"}">
              `).join("")}
            </div>
          `;
        }

        card.innerHTML = `

          ${imagen ? `
            <img
              src="${imagen}"
              class="gc-product-image"
              alt="${product.nombre || "Producto"}"
            >
          ` : ""}

          ${gallery}

          <div class="gc-product-info">

            <div class="gc-badges">

              ${product.oferta ? `
                <span class="gc-badge">
                  🔥 OFERTA
                </span>
              ` : ""}

              ${!disponible ? `
                <span class="gc-badge">
                  AGOTADO
                </span>
              ` : ""}

            </div>

            <div class="gc-product-name">
              ${product.nombre || "Producto"}
            </div>

            <div class="gc-price">

              ${precioAnterior ? `
                <span class="gc-old-price">
                  C$ ${precioAnterior}
                </span>
              ` : ""}

              C$ ${precio}

            </div>

            ${product.color ? `
              <div class="gc-detail">
                🎨 <strong>Color:</strong> ${product.color}
              </div>
            ` : ""}

            ${product.talla ? `
              <div class="gc-detail">
                📏 <strong>Talla:</strong> ${product.talla}
              </div>
            ` : ""}

            ${product.descripcion ? `
              <div class="gc-description">
                ${product.descripcion}
              </div>
            ` : ""}

          </div>

          <a
            href="${whatsappLink}"
            target="_blank"
            class="gc-whatsapp ${disponible ? "gc-available" : "gc-unavailable"}"
          >
            ${disponible ? "💬 Comprar por WhatsApp" : "Agotado"}
          </a>
        `;

        productsContainer.appendChild(card);
      });
    }

    searchInput.addEventListener("input", function () {

      const text = this.value.toLowerCase().trim();

      const filtered = products.filter(product =>
        (product.nombre || "").toLowerCase().includes(text) ||
        (product.descripcion || "").toLowerCase().includes(text) ||
        (product.color || "").toLowerCase().includes(text)
      );

      renderProducts(filtered);
    });
  </script>

</body>
</html>
